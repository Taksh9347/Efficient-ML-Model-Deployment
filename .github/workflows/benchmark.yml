name: Latency Benchmark & Regression Test

on:
  pull_request:
    paths:
      - "app/**"
      - "models/**"
      - "scripts/**"

jobs:
  benchmark:
    name: Model Latency Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train/Export Baseline Model
        run: |
          python scripts/train.py

      - name: Run Latency Gate
        run: |
          pytest tests/test_benchmark.py -v
