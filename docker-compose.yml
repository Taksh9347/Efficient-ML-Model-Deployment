services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-cancer-api
    ports:
      - "8000:8080"
    environment:
      - ENVIRONMENT=production
      - MODEL_PATH=models/cancer_model.onnx
      - LOG_LEVEL=info
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
